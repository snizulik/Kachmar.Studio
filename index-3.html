<title>KACHMAR / STUDIO — переклад і локалізація UA ↔ CZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F3;--sf:#FFFFFF;--ink:#0A1C22;--mut:#506669;--ln:#D2DCDA;--ac:#8A6A2F;--ac2:#2E8F80;--aop:.25;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
@media (min-width:861px) and (hover:hover){html{scroll-snap-type:y proximity}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 Onest,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
.w{max-width:1200px;margin:0 auto;padding:0 28px;position:relative}
h1,h2,h3{font-weight:300;letter-spacing:-.04em;line-height:1.02;margin:0}
#pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:0 50%;z-index:40}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
header.h{transform:translateY(-110%)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{font-weight:600;font-size:15px;letter-spacing:.14em;text-decoration:none;color:var(--ink)}
.logo i{color:var(--ac);font-style:normal;margin:0 .35em}
nav{display:flex;gap:34px;font-size:15px}
nav a{text-decoration:none;color:var(--mut);position:relative;transition:color .3s}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--ac);transform:scaleX(0);transform-origin:right;transition:transform .4s}
nav a:hover{color:var(--ink)}nav a:hover::after{transform:scaleX(1);transform-origin:left}
.lang{display:flex;gap:2px;border:1px solid var(--ln);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font:500 12px Onest;letter-spacing:.08em;padding:7px 12px;border-radius:99px;cursor:pointer;transition:all .3s}
.lang button[aria-pressed="true"]{background:var(--ac);color:var(--bg)}
.hero{position:relative;min-height:calc(100svh - 72px);display:flex;align-items:center;padding:72px 0 96px;overflow:hidden}
.au{position:absolute;inset:-10%;filter:blur(90px);opacity:var(--aop);pointer-events:none}
.au i{position:absolute;border-radius:50%}
.au i:nth-child(1){width:46vw;height:46vw;background:var(--ac2);left:-6%;top:0;animation:d1 22s ease-in-out infinite alternate}
.au i:nth-child(2){width:36vw;height:36vw;background:var(--ac);right:2%;top:30%;opacity:.55;animation:d2 26s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(22vw,14vh) scale(1.2)}}
@keyframes d2{to{transform:translate(-18vw,-12vh) scale(.8)}}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx,70%) var(--my,30%),color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(44px,8.4vw,128px);max-width:12ch}
.hero p{max-width:50ch;font-size:20px;color:var(--mut);margin:34px 0 40px}
.sp .m{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.sp .m i{display:inline-block;font-style:normal;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--k)*70ms + var(--b,0ms))}
.sp.in .m i{transform:none}
.row{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--ac);color:var(--bg);font:500 16px Onest;text-decoration:none;padding:18px 32px;border-radius:99px;border:0;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}
.btn:hover::after{transform:translateX(120%)}
.ln{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ac);padding-bottom:4px}
.roll{position:absolute;right:28px;bottom:36px;font-size:clamp(34px,5.2vw,80px);font-weight:400;letter-spacing:-.03em;line-height:1.3;height:1.3em;overflow:hidden;padding:0 .08em;color:var(--ac);text-align:right;max-width:calc(100% - 56px);white-space:nowrap}
.roll span{display:block;animation:rl .9s cubic-bezier(.2,.9,.2,1)}
@keyframes rl{from{transform:translateY(100%)}to{transform:none}}
.mq{border-block:1px solid var(--ln);overflow:hidden;white-space:nowrap;padding:20px 0;color:var(--mut)}
.mq div{display:inline-block;font-size:15px;letter-spacing:.2em;animation:mq 40s linear infinite}
.mq:hover div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:140px 0 0}
h2{font-size:clamp(34px,5vw,68px);max-width:16ch}
.lead{max-width:54ch;color:var(--mut);margin:24px 0 56px}
.rv{opacity:0;transform:translateY(36px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.svc{border-top:1px solid var(--ln)}
.mob{display:none}.sk{height:470vh;position:relative}.snp{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start;pointer-events:none}
.sks{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);height:min(600px,calc(100svh - 120px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:center}

.si.on{color:var(--ink);padding:22px 0 22px 4px}

.si i{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.si.on i{transform:scaleX(1)}
.sr{display:grid;gap:24px}
.pns{position:relative;height:330px}
.pl{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(30px) scale(.97);clip-path:inset(0 0 100% 0 round 20px);transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1),clip-path .9s cubic-bezier(.2,.8,.2,1),visibility .8s}
.pl.on{opacity:1;visibility:visible;transform:none;clip-path:inset(-4px round 20px)}
.pl .scn{height:100%}
.pi{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dts{display:none;gap:6px}.dts i{height:3px;flex:1;background:var(--ln);border-radius:2px;transition:background .4s}.dts i.on{background:var(--ac)}
.tags{display:flex;gap:10px;flex-wrap:wrap}.tags span{font-size:13px;color:var(--mut);border:1px solid var(--ln);padding:3px 14px;border-radius:99px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.scn{position:relative;height:300px;border:1px solid var(--ln);border-radius:20px;background:var(--bg);overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.tr{display:grid;gap:4px;opacity:0;transform:translateY(10px);transition:all .6s}
.tr.on{opacity:1;transform:none}
.tr span{color:var(--mut);font-size:15px;min-height:1.4em}
.tr b{font-weight:400;color:var(--ac);font-size:20px;min-height:1.4em}
.t6 .tr:nth-child(1) b{color:var(--ink)}
.t6 .tr:nth-child(2) b{color:var(--mut);text-decoration:line-through;text-decoration-color:#B3402F}
.bw{border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:hidden}
.bh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--ln);font-size:12px;color:var(--mut)}
.bh i{width:9px;height:9px;border-radius:50%;background:var(--ln)}
.bh u{text-decoration:none;flex:1;margin:0 10px;background:var(--bg);border-radius:99px;padding:3px 12px}
.lg{display:flex;border:1px solid var(--ln);border-radius:99px;font-size:12px}
.lg b{padding:2px 10px;border-radius:99px;font-weight:500;transition:all .4s}
.lg b.on{background:var(--ac);color:var(--bg)}
.bb{padding:20px}
.bb h4{font:300 26px/1.1 Onest;letter-spacing:-.03em;margin:0 0 8px;min-height:2.2em}
.bb p{margin:0 0 14px;color:var(--mut);font-size:15px;min-height:3em}
.bb .b{display:inline-block;background:var(--ac);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;min-height:1em}
.sn{font-size:12px;color:var(--mut);margin-top:12px;border-top:1px dashed var(--ln);padding-top:8px;min-height:2em}
.gr{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gr i{aspect-ratio:1.3;border-radius:10px;background:var(--sf);border:1px solid var(--ln);opacity:0;transform:scale(.6);transition:all .45s cubic-bezier(.3,1.5,.5,1);position:relative}

.gr i.on{opacity:1;transform:none}.gr i:nth-child(3n).on{background:color-mix(in srgb,var(--ac) 25%,var(--sf))}
.cn2{font:300 44px Onest;color:var(--ac);display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.04em}
.cn2 span{font-size:15px;color:var(--mut);letter-spacing:0}
.gm{background:#0a0a1f;border-color:#2b2b66;color:#fff;font:11px/1.9 "Press Start 2P",monospace;justify-content:space-between;gap:10px;padding:18px}
.gm::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);pointer-events:none}
.gh{display:flex;justify-content:space-between;color:#ffd84a;font-size:10px}
.gb{border:3px solid #fff;padding:14px;min-height:104px;background:#14143a;box-shadow:4px 4px 0 #000}

.gt.bad{color:#ff5d73;text-decoration:line-through}
.car{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.gx{display:flex;align-items:center;font-size:10px;color:#9bff9b}
.hp{flex:1;height:14px;border:2px solid #fff;margin:0 12px;position:relative}
.hp i{position:absolute;left:0;top:0;bottom:0;background:#4ade80;width:30%;transition:width 1s steps(10)}
.xp{color:#ffd84a;opacity:0;transform:translateY(8px);transition:all .5s}.xp.on{opacity:1;transform:none}
.vd{position:relative;flex:1;border-radius:12px;background:linear-gradient(135deg,#1c3a44,#0c1d24 60%,#2b4a3f);overflow:hidden}
.vd::before{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:rgba(255,255,255,.22)}
.cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 14px;border-radius:6px;text-align:center;white-space:pre-line;font-size:16px;line-height:1.3;opacity:0;transition:opacity .35s;width:max-content;max-width:92%}
.cap.on{opacity:1}
.tl{height:44px;display:flex;align-items:center;gap:3px}

.tl i.p{background:var(--ac)}
.tc{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
.rl{font-size:21px;line-height:1.7;min-height:5.2em}
.rl del{text-decoration:underline wavy #B3402F;text-underline-offset:4px;transition:color .5s}
.rl del.x{text-decoration:line-through;color:var(--mut)}
.rl ins{color:#2E7D4F;text-decoration:none;display:inline-block;max-width:0;overflow:hidden;white-space:nowrap;vertical-align:bottom;transition:max-width .9s,margin .9s}

.bd{display:inline-block;font-size:13px;border:1px solid var(--ln);padding:3px 14px;border-radius:99px;color:var(--mut);transition:all .5s}
.bd.ok{border-color:#2E7D4F;color:#2E7D4F}
.gl{display:grid}
.gl div{display:grid;grid-template-columns:1.2fr 1fr 1fr 28px;gap:10px;font-size:15px;padding:9px 0;border-bottom:1px solid var(--ln);opacity:0;transform:translateX(-14px);transition:all .5s;align-items:center}
.gl div.on{opacity:1;transform:none}
.gl b{font-weight:500;color:var(--ac)}.gl span{color:var(--mut)}
.gl u{width:22px;height:22px;border-radius:50%;background:#2E7D4F;color:#fff;display:grid;place-items:center;font-size:13px;text-decoration:none;transform:scale(0);transition:transform .4s .3s cubic-bezier(.3,1.8,.5,1)}
.gl div.on u{transform:scale(1)}
.qa{display:flex;align-items:center;font-size:15px;color:var(--mut)}
.qa em{flex:1;margin:0 16px;height:4px;background:var(--ln);border-radius:4px;position:relative;overflow:hidden}

.qa b{font:300 34px Onest;color:var(--ac);letter-spacing:-.04em;min-width:3.4ch;text-align:right}
.calc{background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:64px;display:grid;grid-template-columns:1fr 1fr;gap:64px;position:relative;overflow:hidden}
.calc::before{content:"";position:absolute;width:520px;height:520px;right:-160px;top:-200px;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 65%);animation:d2 14s ease-in-out infinite alternate}
.calc>*{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 0}

.chips button:hover{border-color:var(--ac);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.fld{display:grid;gap:14px;margin-top:36px}
.fld label{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:15px}
input[type=number]{width:140px;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--ink);font:400 24px Onest;padding:4px 0;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--ln);border-radius:2px;outline-offset:10px}

.out{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--ln);padding-left:64px}
.out small{color:var(--mut);font-size:15px}
.res{font-size:clamp(60px,9vw,128px);font-weight:300;letter-spacing:-.05em;line-height:1;margin:12px 0 18px;color:var(--ac);font-variant-numeric:tabular-nums}
.out .btn{align-self:flex-start;margin-top:32px}
.cx{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:40px}
.tabs{display:flex;flex-direction:column;border-top:1px solid var(--ln)}
.tabs button{text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--mut);font:400 17px/1.35 Onest;padding:20px 8px 20px 20px;cursor:pointer;position:relative;transition:color .3s,padding .4s}
.tabs button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac);transform:scaleY(0);transition:transform .5s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);padding-left:30px}
.tabs button[aria-selected="true"]::before{transform:scaleY(1)}
.cp{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:44px;min-height:540px}

.cp>p{color:var(--mut);margin:0 0 32px;max-width:52ch}
.cp.sw>*{animation:up .7s both}.cp.sw>*:nth-child(2){animation-delay:.08s}.cp.sw>*:nth-child(3){animation-delay:.16s}.cp.sw>*:nth-child(4){animation-delay:.24s}.cp.sw>*:nth-child(5){animation-delay:.32s}

.ba2{display:grid;gap:22px}

  status.textContent=["Не вдалося надіслати. Спробуйте ще раз або напишіть на email.","Odeslání se nezdařilo. Zkuste to znovu nebo napište e-mail.","Could not send. Please try again or email us."][L];
  status.style.display="block";
 }finally{btn.disabled=false;label.textContent=original}
};
/* scroll: progress bar + header hide */
var ly=0,hd=$("hd"),pg=$("pg");
addEventListener("scroll",function(){var y=scrollY,m=document.documentElement.scrollHeight-innerHeight;pg.style.transform="scaleX("+(m>0?y/m:0)+")";hd.classList.toggle("h",y>ly&&y>240);ly=y},{passive:true});
if(!RM){
 /* hero spotlight */
 var hr=$("hero");hr.addEventListener("pointermove",function(e){var r=hr.getBoundingClientRect();hr.style.setProperty("--mx",(e.clientX-r.left)+"px");hr.style.setProperty("--my",(e.clientY-r.top)+"px")});
 /* magnetic buttons */
 document.querySelectorAll(".mg").forEach(function(b){b.addEventListener("pointermove",function(e){var r=b.getBoundingClientRect();b.style.transform="translate("+(e.clientX-r.left-r.width/2)*.2+"px,"+(e.clientY-r.top-r.height/2)*.3+"px)"});b.addEventListener("pointerleave",function(){b.style.transform=""})});
 /* 3D tilt on cards */
 document.querySelectorAll(".cs").forEach(function(c){c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform="rotateY("+x*6+"deg) rotateX("+-y*6+"deg)"});c.addEventListener("pointerleave",function(){c.style.transform=""})});
 /* hero parallax */
 addEventListener("scroll",function(){hr.querySelector(".au").style.transform="translateY("+scrollY*.25+"px)"},{passive:true});
}
render();
setInterval(function(){wi=(wi+1)%W.length;$("roll").innerHTML="<span>"+W[wi]+"</span>"},2600);
</script>
